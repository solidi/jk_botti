name: C/C++ CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Update package list for i386
      run: sudo dpkg --add-architecture i386 && sudo apt-get -y update
    - name: Install packages
      run: sudo apt-get -y install build-essential g++-multilib gcc-mingw-w64 g++-mingw-w64
    - name: make
      run: make
    - name: Upload jk_botti_mm_i386.so
      uses: actions/upload-artifact@v4
      with:
        name: jk_botti_mm_i386
        path: ./addons/jk_botti/dlls/jk_botti_mm_i386.so
    - name: cleanup 1
      run: git clean -xdf
    - name: make win32
      run: make OSTYPE=win32
    - name: Upload jk_botti_mm.dll
      uses: actions/upload-artifact@v4
      with:
        name: jk_botti_mm
        path: ./addons/jk_botti/dlls/jk_botti_mm.dll
    - name: cleanup 2
      run: git clean -xdf
